# Updates a Deploy to Cloudflare copy of shorthop to a new release: Actions →
# Update Shorthop → Run workflow. It opens a pull request (or commits, with
# mode "commit"); merging it deploys through Workers Builds, which also applies
# the database migrations. Your wrangler.toml ids, routes and vars are kept
# (scripts/setup/update-copy.ts). docs/SETUP.md#deploy-button has the details.
#
# The release's code never runs here. One job, which can only read, checks the
# release. The job that can write treats the release as files: it runs the
# updater already in your copy, with install scripts off, and the token appears
# only in the last step. A copy from before 1.2.0 has no updater, so it uses the
# one from Shorthop 2.0.2, fixed by commit below.

name: Update Shorthop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to, such as 1.2.0, or "latest"'
        default: latest
        required: true
      mode:
        description: "pull-request: open a pull request to review and merge. commit: push straight to the default branch (deploys at once)."
        type: choice
        options: [pull-request, commit]
        default: pull-request
      allow_downgrade:
        description: "Go to a version older than the one installed. Older code may not work with a database already migrated."
        type: boolean
        default: false

# Nothing by default: each job says what it needs.
permissions: {}

concurrency:
  group: update-shorthop
  cancel-in-progress: false

jobs:
  check:
    name: Check the release
    # Only in copies: shorthop itself is updated by its own commits.
    if: github.repository != 'jntegz/shorthop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      current: ${{ steps.version.outputs.current }}
      previous: ${{ steps.version.outputs.previous }}
      base: ${{ steps.version.outputs.base }}
    env:
      UPSTREAM: jntegz/shorthop
      INPUT_VERSION: ${{ inputs.version }}
      ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: copy
          persist-credentials: false

      - name: Find the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$INPUT_VERSION" = "latest" ]; then
            tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          else
            tag="v${INPUT_VERSION#v}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$tag\" isn't a version like 1.2.0."
            exit 1
          fi
          # The release's commit, checked to be a published release on upstream's main branch:
          # a tag moved to a commit outside main (or a draft) is refused, and the
          # download is pinned to this commit, not to the tag.
          if [ "$(gh api "repos/$UPSTREAM/releases/tags/$tag" --jq .draft)" != "false" ]; then
            echo "::error::$tag isn't a published release of $UPSTREAM."
            exit 1
          fi
          sha=$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha 2>/dev/null) || sha=""
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Couldn't resolve $tag to a commit."
            exit 1
          fi
          on_main=$(gh api "repos/$UPSTREAM/compare/$sha...main" --jq .status 2>/dev/null) || on_main="not found"
          if [ "$on_main" != "ahead" ] && [ "$on_main" != "identical" ]; then
            echo "::error::$tag ($sha) isn't on $UPSTREAM's main branch ($on_main)."
            exit 1
          fi
          version="${tag#v}"
          current=$(jq -r .version copy/package.json)
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
            echo "current=$current"
            echo "base=$(git -C copy rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$version" ]; then
            echo "Shorthop $current is already up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$current" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::Your copy's version \"$current\" isn't like 1.2.0, so files removed since then stay."
            exit 0
          fi
          # An older release is refused unless asked for: migrations only go forward.
          newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)
          if [ "$newest" != "$version" ] && [ "$ALLOW_DOWNGRADE" != "true" ]; then
            echo "::error::$tag is older than the $current you run. To go back on purpose, run this with \"allow downgrade\" ticked."
            exit 1
          fi
          # The version the copy is on, by commit, to find files the new one removed. Optional.
          previous=$(gh api "repos/$UPSTREAM/commits/v$current" --jq .sha 2>/dev/null) || previous=""
          if printf '%s' "$previous" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "previous=$previous" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::v$current isn't a release, so files removed since then stay."
          fi

  update:
    name: Update the copy
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      UPSTREAM: jntegz/shorthop
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MODE: ${{ inputs.mode }}
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ needs.check.outputs.sha }}
      VERSION: ${{ needs.check.outputs.version }}
      PREVIOUS: ${{ needs.check.outputs.previous }}
      # v2.0.2: the updater for copies that don't have one. A commit, so it can't change.
      FALLBACK_UPDATER: e221df4d68b85935911d88142f92ca360ac63f91
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit the check looked at. Commit mode's push is refused if the branch has moved on.
          ref: ${{ needs.check.outputs.base }}
          path: copy
          # The token stays out of .git/config; the Commit step sets it up.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download the release, as files
        run: |
          mkdir -p "$RUNNER_TEMP/new" "$RUNNER_TEMP/old"
          # By commit: what was checked is exactly what is used. Nothing in it is run.
          curl -sSfL "https://github.com/$UPSTREAM/archive/$SHA.tar.gz" | tar -xz -C "$RUNNER_TEMP/new" --strip-components=1
          found=$(jq -r .version "$RUNNER_TEMP/new/package.json")
          if [ "$found" != "$VERSION" ]; then
            echo "::error::$TAG's package.json says version \"$found\"."
            exit 1
          fi
          echo "Updating to $TAG, commit \`$SHA\` of $UPSTREAM." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$PREVIOUS" ] || ! curl -sSfL "https://github.com/$UPSTREAM/archive/$PREVIOUS.tar.gz" | tar -xz -C "$RUNNER_TEMP/old" --strip-components=1; then
            rm -rf "$RUNNER_TEMP/old"
          fi

      - name: Set up the updater
        run: |
          # The copy as committed, in a folder of its own: its code is what you already run.
          mkdir -p "$RUNNER_TEMP/updater"
          git -C copy archive HEAD | tar -x -C "$RUNNER_TEMP/updater"
          if [ ! -f "$RUNNER_TEMP/updater/scripts/setup/update-copy.ts" ]; then
            echo "Your copy is from before 1.2.0 and has no updater, so this run uses the one from Shorthop 2.0.2 (commit \`$FALLBACK_UPDATER\`)." | tee -a "$GITHUB_STEP_SUMMARY"
            rm -rf "$RUNNER_TEMP/updater"
            mkdir -p "$RUNNER_TEMP/updater"
            if ! curl -sSfL "https://github.com/$UPSTREAM/archive/$FALLBACK_UPDATER.tar.gz" | tar -xz -C "$RUNNER_TEMP/updater" --strip-components=1; then
              echo "::error::Couldn't download the updater. Update with git instead: docs/SETUP.md#update-button."
              exit 1
            fi
          fi
          cd "$RUNNER_TEMP/updater" && npm ci --ignore-scripts --no-audit --no-fund

      - name: Update the files
        working-directory: ${{ runner.temp }}/updater
        run: |
          previous=()
          [ -d "$RUNNER_TEMP/old" ] && previous=(--previous "$RUNNER_TEMP/old")
          npx --no-install tsx scripts/setup/update-copy.ts --source "$RUNNER_TEMP/new" --target "$GITHUB_WORKSPACE/copy" "${previous[@]}" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        working-directory: copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to change." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          branch="shorthop-update-v$VERSION"
          if [ "$MODE" = "commit" ]; then
            echo "Mode \`commit\`: no pull request to review; the update deploys as soon as it's pushed." >> "$GITHUB_STEP_SUMMARY"
            git add -A
            git commit -q -m "Update Shorthop to $VERSION"
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo "Committed to $DEFAULT_BRANCH. Workers Builds deploys it now." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -q -b "$branch"
          git add -A
          git commit -q -m "Update Shorthop to $VERSION"
          git push -f origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The pull request for $branch is updated." | tee -a "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Update Shorthop to $VERSION" --body-file "$RUNNER_TEMP/summary.md"; then
            echo "Opened a pull request: merge it to deploy." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # New repositories don't let Actions open pull requests until you allow it
            # (Settings → Actions → General → Allow GitHub Actions to create and approve pull requests).
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$branch?expand=1"
            {
              echo
              echo "### Open the pull request yourself"
              echo
              echo "GitHub didn't let this workflow open it. The update is on the branch \`$branch\`: [compare and open the pull request]($url), then merge it."
              echo "Or allow it once (Settings → Actions → General → Allow GitHub Actions to create and approve pull requests) and run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Open the pull request at $url"
          fi
