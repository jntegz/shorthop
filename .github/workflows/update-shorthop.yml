# Updates a Deploy to Cloudflare copy of shorthop to a new release: Actions →
# Update Shorthop → Run workflow. It opens a pull request (or commits, with
# mode "commit"); merging it deploys through Workers Builds, which also applies
# the database migrations. Your wrangler.toml ids, routes and vars are kept
# (scripts/setup/update-copy.ts). docs/SETUP.md#deploy-button has the details.

name: Update Shorthop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to, such as 1.2.0, or "latest"'
        default: latest
        required: true
      mode:
        description: "pull-request: open a pull request to review and merge. commit: push straight to the default branch (deploys at once)."
        type: choice
        options: [pull-request, commit]
        default: pull-request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-shorthop
  cancel-in-progress: false

jobs:
  update:
    # Only in copies: shorthop itself is updated by its own commits.
    if: github.repository != 'jntegz/shorthop'
    runs-on: ubuntu-latest
    env:
      UPSTREAM: jntegz/shorthop
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      INPUT_VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: copy
          # The token stays out of .git/config while the release's npm ci runs; Commit sets it up.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Find the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$INPUT_VERSION" = "latest" ]; then
            tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          else
            tag="v${INPUT_VERSION#v}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$tag\" isn't a version like 1.2.0."
            exit 1
          fi
          # The release's commit, checked to be a published release on upstream's main branch:
          # a tag moved to a commit outside main (or a draft) is refused, and the
          # download below is pinned to this commit, not to the tag.
          if [ "$(gh api "repos/$UPSTREAM/releases/tags/$tag" --jq .draft)" != "false" ]; then
            echo "::error::$tag isn't a published release of $UPSTREAM."
            exit 1
          fi
          sha=$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha 2>/dev/null) || sha=""
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Couldn't resolve $tag to a commit."
            exit 1
          fi
          on_main=$(gh api "repos/$UPSTREAM/compare/$sha...main" --jq .status 2>/dev/null) || on_main="not found"
          if [ "$on_main" != "ahead" ] && [ "$on_main" != "identical" ]; then
            echo "::error::$tag ($sha) isn't on $UPSTREAM's main branch ($on_main)."
            exit 1
          fi
          current=$(node -p "require('./copy/package.json').version")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "${tag#v}" ]; then
            echo "Shorthop $current is already up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          mkdir -p "$RUNNER_TEMP/new" "$RUNNER_TEMP/old"
          # By commit: what was checked above is exactly what runs below.
          curl -sSfL "https://github.com/$UPSTREAM/archive/$SHA.tar.gz" | tar -xz -C "$RUNNER_TEMP/new" --strip-components=1
          echo "Updating to $TAG, commit \`$SHA\` of $UPSTREAM." >> "$GITHUB_STEP_SUMMARY"
          # The version the copy is on, to find files the new one removed. Optional.
          curl -sSfL "https://github.com/$UPSTREAM/archive/refs/tags/v$CURRENT.tar.gz" | tar -xz -C "$RUNNER_TEMP/old" --strip-components=1 \
            || { echo "::warning::v$CURRENT isn't a release, so files removed since then stay."; rm -rf "$RUNNER_TEMP/old"; }
          cd "$RUNNER_TEMP/new" && npm ci --no-audit --no-fund

      - name: Update the files
        if: steps.version.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/new
        run: |
          previous=()
          [ -d "$RUNNER_TEMP/old" ] && previous=(--previous "$RUNNER_TEMP/old")
          npx tsx scripts/setup/update-copy.ts --target "$GITHUB_WORKSPACE/copy" "${previous[@]}" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: steps.version.outputs.skip != 'true'
        working-directory: copy
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to change." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          branch="shorthop-update-v$VERSION"
          if [ "$MODE" = "commit" ]; then
            echo "Mode \`commit\`: no pull request to review; the update deploys as soon as it's pushed." >> "$GITHUB_STEP_SUMMARY"
            git add -A
            git commit -q -m "Update Shorthop to $VERSION"
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo "Committed to $DEFAULT_BRANCH. Workers Builds deploys it now." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -q -b "$branch"
          git add -A
          git commit -q -m "Update Shorthop to $VERSION"
          git push -f origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The pull request for $branch is updated." | tee -a "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Update Shorthop to $VERSION" --body-file "$RUNNER_TEMP/summary.md"; then
            echo "Opened a pull request: merge it to deploy." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # New repositories don't let Actions open pull requests until you allow it
            # (Settings → Actions → General → Allow GitHub Actions to create and approve pull requests).
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$branch?expand=1"
            {
              echo
              echo "### Open the pull request yourself"
              echo
              echo "GitHub didn't let this workflow open it. The update is on the branch \`$branch\`: [compare and open the pull request]($url), then merge it."
              echo "Or allow it once (Settings → Actions → General → Allow GitHub Actions to create and approve pull requests) and run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Open the pull request at $url"
          fi
