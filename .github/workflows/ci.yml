name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on known high or critical vulnerabilities in what the Worker and the admin ship.
      - run: npm audit --omit=dev --audit-level=high
      # Build tools (Wrangler, Vite, tsx) run with deploy rights too, but most of their advisories
      # don't apply here: they are reported on the run, and don't fail it.
      - name: Report advisories in build tools
        run: |
          if ! npm audit --audit-level=high > "$RUNNER_TEMP/audit.txt"; then
            echo "::warning::npm audit reports high or critical advisories in the dev dependencies (or couldn't run). See the job summary."
            {
              echo "### npm audit, dev dependencies included"
              echo
              echo '```'
              tail -n 40 "$RUNNER_TEMP/audit.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run typecheck
      - run: npm test
      - name: Build with the example config
        run: npm run build
        env:
          SHORTHOP_ALLOW_EXAMPLE_CONFIG: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # The checksum is from the release's gitleaks_8.30.1_checksums.txt.
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact -v'
